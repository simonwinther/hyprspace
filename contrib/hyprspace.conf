# hyprspace — drop-in Hyprland bindings and settings.
#
# In your hyprland.conf, after every other bindings file so the unbinds below
# win:
#
#   plugin = /home/YOU/.local/share/hyprspace/hyprspace.so
#   source = ~/dev/hyprspace/contrib/hyprspace.conf
#
# The `plugin` line must use an absolute path — Hyprland does not expand `~`
# for it — which is why it lives in your config rather than in this file.
# `make install` prints the exact line to paste.

# ---------------------------------------------------------------- keybindings

# SUPER + A -> workspace overview.
#
# Not GRAVE: on a Danish (and most non-US) layout the key above Tab is not
# backtick at all, so `bind = SUPER, GRAVE` never fires.
#
# The same binding closes it again — pressing it a second time toggles. Inside
# the overview:
#
#   1-9, 0            switch to that workspace immediately (0 means workspace
#                     10, which is what the key is next to on the number row)
#   arrows, Tab,      move the selection
#   Ctrl+h/j/k/l
#   Enter             go to the selected workspace
#   click a window    focus it
#   Esc               close, changing nothing
#
#   SUPER + drag left    pick a window up and drop it on another workspace tile
#   SUPER + drag right   resize that window in place, scaled into the tile
#
# On more than one monitor the overview opens on all of them at once, each
# showing its own workspaces, and closes everywhere as soon as you pick
# somewhere or press Esc. Keys and clicks go to the screen the pointer is on.
# Set overview:all_monitors = false below for one screen at a time instead.
#
# Super-modified keys are deliberately passed straight through while the
# overview is up, so the rest of your Super shortcuts keep working.
bind = SUPER, A, hyprspace:overview

# Optional: tapping Super on its own does the same. `bindr` fires on release, so
# Super held as a modifier for another shortcut will not open the overview.
# Uncomment if you want it — some people find a bare-modifier binding twitchy.
# bindr = SUPER, SUPER_L, hyprspace:overview

# ALT + Tab -> window switcher. Hold Alt and keep tapping Tab to step; release
# Alt to commit. While Alt is held, W closes the highlighted window without
# focusing it and leaves the switcher open. Both bindings must be freed first:
# Omarchy leaves ALT+Tab alone but keeps ALT+SHIFT+Tab on changegroupactive.
unbind = ALT, TAB
unbind = ALT SHIFT, TAB
bind = ALT, TAB, hyprspace:switch
bind = ALT SHIFT, TAB, hyprspace:switch, prev

# ------------------------------------------------------------------- settings
# Every value below is shown at its default; delete the ones you do not change.

plugin {
    hyprspace {
        # Move the selection to whatever the pointer is over.
        follow_mouse = true

        # Warp the pointer onto the chosen window when committing a selection.
        # Leave this on if input:follow_mouse is enabled (Hyprland's default,
        # and Omarchy's), otherwise the pointer's position immediately steals
        # the focus back and the selection appears to do nothing.
        warp_cursor = true

        overview {
            bg_dim           = 0.80         # how strongly to dim the desktop, 0-1
            bg_color         = rgba(11111bff)
            tile_bg_color    = rgba(0d0d14d9) # plate behind each workspace tile
            tile_border_color = rgba(ffffff1a) # hairline around every tile
            padding          = 56           # outer padding, px
            gap              = 28           # gap between workspace tiles, px
            rounding         = 14           # tile corner radius, px
            border_size      = 3            # selection border thickness, px
            active_border    = rgba(89b4faff)
            hover_border     = rgba(89b4fa80)
            workspace_labels = true         # workspace name under each tile
            label_color      = rgba(cdd6f4ff)
            title_bg_color   = rgba(1e1e2ee6) # backdrop behind that label
            include_special  = true         # include scratchpad workspaces

            # Open on every monitor at once rather than only the one under the
            # pointer, so a single press shows you the whole desktop. They also
            # close together: picking a workspace on one screen dismisses the
            # rest without changing them. Keyboard and mouse go to whichever
            # screen the pointer is on.
            all_monitors     = true
            font             = Sans 12

            # Workspaces with a fullscreen or maximized window spread their
            # previews apart. The outline and badge identify that window;
            # its desktop state stays intact while the overview is open.
            fullscreen_border = rgba(89b4faff)
        }

        switcher {
            icon_size              = 96
            padding                = 24
            gap                    = 12
            rounding               = 20
            bg_color               = rgba(1e1e2ef0)
            highlight_color        = rgba(89b4fa40)
            text_color             = rgba(cdd6f4ff)
            show_title             = true

            # Alt+Tab cycles the active workspace and nothing else. A
            # workspace holding one window therefore has nowhere to switch to,
            # which is correct: crossing workspaces is the overview's job.
            # Set false to cycle every window on the monitor instead.
            current_workspace_only = true
            font                   = Sans 13
        }
    }
}

# The open/close transition follows Hyprland's own animation curves:
#   overview -> `windowsMove`
#   switcher -> `fadeIn`
# Retune them in your animations block if you want a different feel.
