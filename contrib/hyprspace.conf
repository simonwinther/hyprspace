# hyprspace — drop-in Hyprland bindings and settings.
#
# In your hyprland.conf, after every other bindings file so the unbinds below
# win:
#
#   plugin = /home/YOU/.local/share/hyprspace/hyprspace.so
#   source = ~/dev/hyprspace/contrib/hyprspace.conf
#
# The `plugin` line must use an absolute path — Hyprland does not expand `~`
# for it — which is why it lives in your config rather than in this file.
# `make install` prints the exact line to paste.

# ---------------------------------------------------------------- keybindings

# SUPER + A -> workspace overview.
#
# Not GRAVE: on a Danish (and most non-US) layout the key above Tab is not
# backtick at all, so `bind = SUPER, GRAVE` never fires.
bind = SUPER, A, hyprspace:overview

# Optional: tapping Super on its own does the same. `bindr` fires on release, so
# Super held as a modifier for another shortcut will not open the overview.
# Uncomment if you want it — some people find a bare-modifier binding twitchy.
# bindr = SUPER, SUPER_L, hyprspace:overview

# ALT + Tab -> window switcher. Hold Alt and keep tapping Tab to step; release
# Alt to commit. Both bindings must be freed first: Omarchy leaves ALT+Tab alone
# but keeps ALT+SHIFT+Tab on changegroupactive.
unbind = ALT, TAB
unbind = ALT SHIFT, TAB
bind = ALT, TAB, hyprspace:switch
bind = ALT SHIFT, TAB, hyprspace:switch, prev

# ------------------------------------------------------------------- settings
# Every value below is shown at its default; delete the ones you do not change.

plugin {
    hyprspace {
        # Move the selection to whatever the pointer is over.
        follow_mouse = true

        # Warp the pointer onto the chosen window when committing a selection.
        # Leave this on if input:follow_mouse is enabled (Hyprland's default,
        # and Omarchy's), otherwise the pointer's position immediately steals
        # the focus back and the selection appears to do nothing.
        warp_cursor = true

        overview {
            bg_dim           = 0.80         # how strongly to dim the desktop, 0-1
            bg_color         = rgba(11111bff)
            tile_bg_color    = rgba(1e1e2ed9) # plate behind each workspace tile
            padding          = 56           # outer padding, px
            gap              = 28           # gap between workspace tiles, px
            rounding         = 14           # tile corner radius, px
            border_size      = 3            # selection border thickness, px
            active_border    = rgba(89b4faff)
            hover_border     = rgba(89b4fa80)
            workspace_labels = true         # workspace name under each tile
            label_color      = rgba(cdd6f4ff)
            title_bg_color   = rgba(1e1e2ee6) # backdrop behind that label
            include_special  = true         # include scratchpad workspaces
            font             = Sans 12
        }

        switcher {
            icon_size              = 96
            padding                = 24
            gap                    = 12
            rounding               = 20
            bg_color               = rgba(1e1e2ef0)
            highlight_color        = rgba(89b4fa40)
            text_color             = rgba(cdd6f4ff)
            show_title             = true
            current_workspace_only = false
            font                   = Sans 13
        }
    }
}

# The open/close transition follows Hyprland's own animation curves:
#   overview -> `windowsMove`
#   switcher -> `fadeIn`
# Retune them in your animations block if you want a different feel.
