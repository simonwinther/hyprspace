# hyprspace — drop-in Hyprland configuration.
#
#   source = ~/dev/hyprspace/contrib/hyprspace.conf
#
# ...or copy the contents into your own config. Adjust the plugin path if you
# installed somewhere other than the default PREFIX.

plugin = ~/.local/share/hyprspace/hyprspace.so

# ---------------------------------------------------------------- keybindings

# Tap Super on its own -> overview. `bindr` fires on key *release*, so Super
# used as a modifier for another shortcut does not open the overview.
bindr = SUPER, SUPER_L, hyprspace:overview

# Alt+Tab -> switcher. Hold Alt and tap Tab to keep stepping; release Alt to
# commit. `repeat` is not wanted here, but the binding must not be consumed by
# anything else, so unbind whatever owned it first.
unbind = ALT, TAB
unbind = ALT SHIFT, TAB
bind = ALT, TAB, hyprspace:switch
bind = ALT SHIFT, TAB, hyprspace:switch, prev

# Optional: an explicit overview binding for people who would rather not use a
# bare Super tap.
# bind = SUPER, GRAVE, hyprspace:overview

# ------------------------------------------------------------------- settings
# Every value below is shown at its default; delete the ones you do not change.

plugin {
    hyprspace {
        # Move the selection to whatever the pointer is over.
        follow_mouse = true

        # Warp the pointer onto the chosen window when committing a selection.
        # Leave this on if input:follow_mouse is enabled (Hyprland's default),
        # otherwise the pointer's position immediately steals the focus back.
        warp_cursor = true

        overview {
            bg_dim            = 0.80        # how strongly to dim the desktop, 0-1
            bg_color          = rgba(11111bff)
            padding           = 40          # outer padding, px
            gap               = 24          # gap between tiles, px
            band_gap          = 28          # gap between workspace rows, px
            rounding          = 12          # tile corner radius, px
            border_size       = 3           # selection border thickness, px
            active_border     = rgba(89b4faff)
            hover_border      = rgba(89b4fa80)
            workspace_labels  = true
            label_gutter      = 56          # width of the left label column, px
            label_color       = rgba(cdd6f4ff)
            window_titles     = true        # title on the selected tile
            title_color       = rgba(cdd6f4ff)
            title_bg_color    = rgba(1e1e2ee6)
            include_special   = true        # include scratchpad workspaces
            all_workspaces    = true        # false = active workspace only
            font              = Sans 12
        }

        switcher {
            icon_size               = 96
            padding                 = 24
            gap                     = 12
            rounding                = 20
            bg_color                = rgba(1e1e2ef0)
            highlight_color         = rgba(89b4fa40)
            text_color              = rgba(cdd6f4ff)
            show_title              = true
            current_workspace_only  = false
            font                    = Sans 13
        }
    }
}

# The open/close transition follows Hyprland's own animation curves:
#   overview -> `windowsMove`
#   switcher -> `fadeIn`
# Retune them in your animations block if you want a different feel.
