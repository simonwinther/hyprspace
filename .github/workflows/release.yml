name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v1.0.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        description: Commit returned by Release Please
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED: ${{ inputs.commit }}
        run: |
          python3 scripts/check-release.py --tag "$TAG"
          commit=$(git rev-parse HEAD)
          test -z "$EXPECTED" || test "$commit" = "$EXPECTED"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  draft:
    needs: [resolve, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tooling
        run: python3 release-tools/test/test_release.py
      - name: Attach source and checksums to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 release-tools/scripts/release-draft.py --root "$GITHUB_WORKSPACE/source" --tag "$TAG" --commit "$COMMIT"
