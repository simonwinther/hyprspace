name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ clang make pkg-config libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev librsvg2-dev jq python3 ripgrep
      - name: Run host and build tests
        env:
          CXX: ${{ matrix.compiler }}
        run: make test
      - name: Run sanitizers
        if: matrix.compiler == 'g++'
        run: make -C test asan
      - name: Check release files
        run: |
          make release-check
          python3 test/test_release.py
          for script in scripts/*.sh test/test_build.sh; do
            bash -n "$script"
          done

  plugin:
    name: Build (Hyprland 0.56.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Build against the supported compositor
        run: docker build --file .github/ci/Dockerfile --tag hyprspace-ci .

  nix:
    name: Nix (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build and verify package and ABI
        run: python3 scripts/check-nix.py
